<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clay & Stuff — Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-page">

        <!-- Background -->
        <div class="background-decoration"></div>

        <!-- Login Card -->
        <div class="login-card">

            <button class="close-btn"
                    onclick="goHome()">
                ×
            </button>

            <div class="logo">
                ♡
            </div>

            <h1>
                Welcome back
            </h1>

            <p class="subtitle">
                Log in to continue your Clay & Stuff journey.
            </p>


            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <button
                        type="button"
                        id="showPassword"
                    >
                        👁
                    </button>

                </div>


                <div class="forgot">
                    <a href="#">
                        Forgot password?
                    </a>
                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Log in
                </button>

            </form>


            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Sign up
                </a>

            </p>

        </div>

    </div>


    <script src="login.js"></script>
</body>
</html>
