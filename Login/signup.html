<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clay & Stuff — Create Account</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>

    <div class="login-page">

        <div class="background-decoration"></div>


        <div class="login-card signup-card">

            <button
                class="close-btn"
                onclick="goHome()"
            >
                ×
            </button>


            <div class="logo">
                ✦
            </div>


            <h1>
                Create your account
            </h1>


            <p class="subtitle">
                Join Clay & Stuff and start creating.
            </p>


            <form id="signupForm">


                <label for="fullName">
                    Full name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter your full name"
                    required
                >


                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    required
                >


                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password"
                    required
                >


                <label for="confirmPassword">
                    Confirm password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    required
                >


                <button
                    type="submit"
                    class="login-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Log in
                </a>

            </p>

        </div>

    </div>


    <script src="login.js"></script>

</body>
</html>
