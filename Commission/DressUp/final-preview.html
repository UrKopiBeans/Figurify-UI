<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Figurify - Final Design Preview</title>
    <link rel="stylesheet" href="dressup.css">
    <link rel="stylesheet" href="final-preview.css">
</head>
<body data-page="preview">

    <main class="final-review-page">
        <section class="preview-container preview-stage">
            <div class="preview-header">
                 <h1>Final Design</h1>
            </div>
            <div class="figure-area">
                <canvas id="figureViewer" class="figure-viewer"></canvas>
            </div>
            <div class="review-card legacy-preview-fields">
                <div class="review-row">
                    <span>Figure Style</span>
                    <strong id="previewCategory">Not selected</strong>
                </div>
                <div class="review-row">
                    <span>Figure Size</span>
                    <strong id="previewFigureSize">Not selected</strong>
                </div>
                <div class="review-row">
                    <span>Figure Name</span>
                    <strong id="previewFigureName">Not provided</strong>
                </div>
                <div class="review-row">
                    <span>Box</span>
                    <strong id="previewBox">Without box</strong>
                </div>
                <div class="review-row">
                    <span>Order Type</span>
                    <strong id="previewOrderType">Not selected</strong>
                </div>
                <div class="review-row">
                    <span>Booking Date</span>
                    <strong id="previewBookingDate">Not selected</strong>
                </div>
                <div class="review-row total-row">
                    <span>Estimated Total</span>
                    <strong id="previewPrice">₱0</strong>
                </div>
            </div>
            <div class="review-card receipt-summary" id="previewReceipt">
                <div class="receipt-empty">No customization selected yet.</div>
            </div>
            <div class="preview-actions">
                <button type="button" class="secondary-button" id="editDesignBtn">Edit Figure</button>
                <button type="button" class="secondary-button download-button" id="downloadDesignBtn">Download Design</button>
                <button type="button" class="main-button" id="confirmDesignBtn">
                    Confirm
                </button>
            </div>
        </section>
    </main>
    <script type="importmap">
    {
        "imports": {
            "three": "../../node_modules/three/build/three.module.js",
            "three/addons/": "../../node_modules/three/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="dressup.js"></script>
    <script type="module" src="final-preview.js"></script>
</body>
</html>
